# usherma Static Site Docker Compose | nginx with dev environment

services:
    nginx:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: usherma_nginx
        volumes:
            - ./src:/usr/share/nginx/html
            - /var/run/docker.sock:/var/run/docker.sock:ro # For Docker CLI access (optional)
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.usherma.rule=Host(`usherma.localhost`)'
            - 'traefik.http.services.usherma.loadbalancer.server.port=80'
        networks:
            - shared-network
        # Keep container running for development
        tty: true
        stdin_open: true

networks:
    shared-network:
        external: true
