server {
    listen 80;
    server_name usherma.localhost;
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Hide .html extension from URLs (must come before other rules)
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }
    
    # URL Rewrites - Convert IIS rewrites to Nginx (Internal rewrites, not redirects)
    # Page rewrites - serve actual files but keep clean URLs (exact matches have priority)
    location = /behind-our-name {
        rewrite ^ /tale.html last;
    }
    location = /leadership {
        rewrite ^ /founder.html last;
    }
    location = /partnerships {
        rewrite ^ /clients.html last;
    }
    location = /home {
        rewrite ^ /index.html last;
    }
    location = /contact {
        rewrite ^ /contact.html last;
    }
    
    # Services rewrites - serve actual files but keep clean URLs
    location = /services/marketing-management-consultancy {
        rewrite ^ /services/mmc.html last;
    }
    location = /services/marketing-management-outsourcing {
        rewrite ^ /services/mmo.html last;
    }
    location = /services/strategic-marketing-planning {
        rewrite ^ /services/smp.html last;
    }
    location = /services/brand-management {
        rewrite ^ /services/bm.html last;
    }
    location = /services/relationship-marketing {
        rewrite ^ /services/rm.html last;
    }
    location = /services/communication-planning {
        rewrite ^ /services/cp.html last;
    }
    location = /services/retail-marketing {
        rewrite ^ /services/retm.html last;
    }
    
    # Handle clean URLs - try to serve .html files (fallback)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Block access to web.config (IIS file)
    location = /web.config {
        deny all;
    }
    
    # Error pages
    error_page 404 /index.html;
}