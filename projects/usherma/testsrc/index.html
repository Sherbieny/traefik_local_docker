<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Usherma - Static Site</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
                line-height: 1.6;
                color: #333;
            }
            h1 {
                color: #2c3e50;
                border-bottom: 2px solid #3498db;
                padding-bottom: 0.5rem;
            }
            .info {
                background: #f8f9fa;
                padding: 1rem;
                border-radius: 6px;
                margin: 1rem 0;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to Usherma</h1>
        <div class="info">
            <p>🎉 Your static site is now running on Nginx!</p>
            <p>📁 Place your HTML, CSS, JS files in the <code>testsrc/</code> directory</p>
            <p>
                🌐 Access your site at
                <a href="http://usherma.localhost">http://usherma.localhost</a>
            </p>
        </div>

        <script>
            console.log('Static site loaded successfully!');
            document.addEventListener('DOMContentLoaded', function () {
                console.log('DOM fully loaded');
            });
        </script>
    </body>
</html>
